<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AttendX | Login</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Login CSS -->

    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/login.css') }}">

</head>

<body>

    <!-- Background Shapes -->

    <div class="circle circle1"></div>
    <div class="circle circle2"></div>

    <div class="container">

        <div class="row min-vh-100 align-items-center">

            <!-- LEFT SIDE -->

            <div class="col-lg-6 left-panel">

                <div class="brand-content">

                    <span class="badge bg-light text-primary mb-4">

                        AttendX 1.0

                    </span>

                    <h1 class="display-3 fw-bold">

                        Attend<span class="text-primary">X</span>

                    </h1>

                    <p class="lead mt-4">

                        Offline Smart Attendance
                        Management System for
                        Schools,
                        Colleges,
                        Coaching Centers
                        and Offices.

                    </p>

                    <div class="feature-list mt-5">

                        <div class="feature-item">

                            <i class="bi bi-check-circle-fill"></i>

                            Face Recognition

                        </div>

                        <div class="feature-item">

                            <i class="bi bi-check-circle-fill"></i>

                            Offline Attendance

                        </div>

                        <div class="feature-item">

                            <i class="bi bi-check-circle-fill"></i>

                            Analytics Dashboard

                        </div>

                        <div class="feature-item">

                            <i class="bi bi-check-circle-fill"></i>

                            Excel & PDF Reports

                        </div>

                    </div>

                    <img src="{{ url_for('static', filename='images/hero.svg') }}"
                        class="img-fluid hero-image mt-5"
                        alt="AttendX">

                </div>

            </div>

            <!-- RIGHT SIDE -->

            <div class="col-lg-6">

                <div class="login-card">

                    <div class="text-center mb-4">

                        <h2 class="fw-bold">

                            Welcome Back 👋

                        </h2>

                        <p class="text-muted">

                            Sign in to continue to AttendX

                        </p>

                    </div>

                    <form>

                        <!-- EMAIL -->

                        <div class="mb-4">

                            <label class="form-label">

                                Email Address

                            </label>

                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="bi bi-envelope-fill"></i>

                                </span>

                                <input
                                    type="email"
                                    class="form-control"
                                    placeholder="Enter your email">

                            </div>

                        </div>

                        <!-- PASSWORD -->

                        <div class="mb-4">

                            <label class="form-label">

                                Password

                            </label>

                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="bi bi-lock-fill"></i>

                                </span>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="password"
                                    placeholder="Enter your password">

                                <button
                                    class="btn btn-outline-secondary"
                                    type="button"
                                    id="togglePassword">

                                    <i class="bi bi-eye-fill"></i>

                                </button>

                            </div>

                        </div>

                        <!-- REMEMBER -->

                        <div class="d-flex justify-content-between align-items-center mb-4">

                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="remember">

                                <label
                                    class="form-check-label"
                                    for="remember">

                                    Remember Me

                                </label>

                            </div>

                            <a href="#"
                                class="forgot-link">

                                Forgot Password?

                            </a>

                        </div>

                        <!-- LOGIN -->

                        <button
                            type="submit"
                            class="btn btn-primary w-100 login-btn">

                            <i class="bi bi-box-arrow-in-right me-2"></i>

                            Login

                        </button>

                    </form>

                    <hr class="my-4">

                    <div class="text-center">

                        <a href="/"
                            class="back-home">

                            <i class="bi bi-arrow-left"></i>

                            Back to Home

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Bootstrap -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Password Toggle -->

    <script>

        const password = document.getElementById("password");

        const togglePassword = document.getElementById("togglePassword");

        togglePassword.addEventListener("click", () => {

            if (password.type === "password") {

                password.type = "text";

                togglePassword.innerHTML =
                    '<i class="bi bi-eye-slash-fill"></i>';

            }

            else {

                password.type = "password";

                togglePassword.innerHTML =
                    '<i class="bi bi-eye-fill"></i>';

            }

        });

    </script>

</body>

</html>
