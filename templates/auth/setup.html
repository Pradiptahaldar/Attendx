<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AttendX | Organization Setup</title>

    <!-- Google Font -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/setup.css') }}">

</head>

<body>

<div class="container">

<div class="row min-vh-100 align-items-center">

<!-- LEFT -->

<div class="col-lg-6">

<h1>

Attend<span class="text-primary">X</span>

</h1>

<h2 class="mt-4">

Welcome!

</h2>

<p>

Let's create your organization and prepare
AttendX for first use.

</p>

<ul>

<li>✔ Secure Setup</li>

<li>✔ Less than one minute</li>

<li>✔ One administrator account</li>

<li>✔ Ready for schools, colleges and offices</li>

</ul>

</div>

<!-- RIGHT -->

<div class="col-lg-6">

<div class="setup-card">

<h2>

Create Organization

</h2>

<p>

Fill in the information below.

</p>

<form>

<div class="mb-3">

<label>

Organization Name

</label>

<input
type="text"
class="form-control">

</div>

<div class="mb-3">

<label>

Administrator Name

</label>

<input
type="text"
class="form-control">

</div>

<div class="mb-3">

<label>

Email

</label>

<input
type="email"
class="form-control">

</div>

<div class="mb-3">

<label>

Password

</label>

<input
type="password"
class="form-control">

</div>

<div class="mb-4">

<label>

Confirm Password

</label>

<input
type="password"
class="form-control">

</div>

<button
class="btn btn-primary w-100">

Create Organization

</button>

</form>

</div>

</div>

</div>

</div>

<!-- Bootstrap -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
